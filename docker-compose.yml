version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: aerovault_postgres
    restart: always
    environment:
      POSTGRES_USER: aerovault_admin
      POSTGRES_PASSWORD: AeroVaultPuebla2026!
      POSTGRES_DB: aerovault_puebla
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: aerovault_fastapi
    restart: always
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: .
    container_name: aerovault_streamlit
    restart: always
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data: